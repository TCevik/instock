<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>

    <link rel="stylesheet" href="css/index.css">
    <script type="module" src="js/index.js"></script>

    <title>InStock Dashboard</title>
</head>
<body>
    <div class="dashboard-shapes">
        <svg class="dash-shape dash-shape-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" /></svg>
        <svg class="dash-shape dash-shape-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9" /></svg>
        <svg class="dash-shape dash-shape-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        <svg class="dash-shape dash-shape-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 3 22 21 2 21" /></svg>
        <svg class="dash-shape dash-shape-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9" /></svg>
        <svg class="dash-shape dash-shape-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" /></svg>
        <svg class="dash-shape dash-shape-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 3 22 21 2 21" /></svg>
        <svg class="dash-shape dash-shape-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        <svg class="dash-shape dash-shape-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" /></svg>
        <svg class="dash-shape dash-shape-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 3 22 21 2 21" /></svg>
    </div>
    <main class="page-container">
        <div class="dashboard-hero">
            <div class="hero-content">
                <div class="hero-greeting">
                    <span class="hero-badge">Dashboard</span>
                    <h1 class="welcome-heading" id="welcomeText">Welkom terug</h1>
                    <p class="dashboard-subtitle">Beheer en navigeer eenvoudig door je winkelmodules</p>
                </div>
                <div class="hero-actions">
                    <button id="dashboardChangePasswordBtn" class="hero-action-btn">
                        <span class="material-icons">lock_reset</span>
                        <span>Wachtwoord wijzigen</span>
                    </button>
                    <button id="dashboardPasskeyBtn" class="hero-action-btn">
                        <span class="material-icons">fingerprint</span>
                        <span>Passkey instellen</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="dashboard-section-header">
            <h2>Beschikbare Modules</h2>
            <span class="section-badge" id="moduleCountBadge"></span>
        </div>

        <div class="dashboard-grid" id="dashboardGrid"></div>
    </main>
</body>
</html>
