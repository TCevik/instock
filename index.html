<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/main.js"></script>

    <link rel="stylesheet" href="css/index.css" />
    <script type="module" src="js/index.js"></script>

    <title>InStock Dashboard</title>
  </head>
  <body>
    <div class="dashboard-shapes"></div>
    <main class="page-container">
      <div class="dashboard-hero">
        <div class="hero-content">
          <div class="hero-greeting">
            <span class="hero-badge">Dashboard</span>
            <h1 class="welcome-heading" id="welcomeText">Welkom terug</h1>
            <p class="dashboard-subtitle">
              Beheer en navigeer eenvoudig door je winkelmodules
            </p>
          </div>
          <div class="hero-actions">
            <a href="account.html" id="dashboardAccountBtn" class="hero-action-btn" style="text-decoration: none;">
              <span class="material-icons">manage_accounts</span>
              <span>Accountbeheer</span>
            </a>
          </div>
        </div>
      </div>

      <div class="dashboard-section-header">
        <h2>Beschikbare Modules</h2>
        <span class="section-badge" id="moduleCountBadge"></span>
      </div>

      <div class="dashboard-grid" id="dashboardGrid"></div>
    </main>
  </body>
</html>
