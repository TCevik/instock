<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instellingen Winkel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/instellingen_winkel.css">
    <script src="scripts/instellingen_winkel.js" type="module"></script>
</head>

<body>
    <main class="dashboard-container">
        <div class="page-header page-header-col">
            <div class="page-header-row">
                <i class="material-icons page-header-icon">store</i>
                <h1 class="page-header-title">Instellingen Winkel</h1>
            </div>
            <p class="page-header-subtitle">Beheer winkelinstellingen en pagina-toegang voor medewerkers</p>
        </div>
        <div class="management-card">
            <div class="message" id="message-box">
                <i class="material-icons" id="message-icon"></i>
                <span id="message-text"></span>
            </div>
            <form id="store-settings-form">
                <h2 class="settings-section-title">Module-toegang voor medewerkers</h2>
                <p class="settings-section-subtitle">Bepaal welke pagina's zichtbaar zijn op het dashboard en in het
                    zijmenu.</p>
                <div class="modules-grid" id="modules-container">
                    <div class="loading-cell">Instellingen laden...</div>
                </div>
                <h2 class="settings-section-title" style="margin-top: 24px;">Winkelkleuren</h2>
                <p class="settings-section-subtitle">Kies de primaire accentkleur voor de winkel.</p>
                <div class="color-options-grid" id="color-options-container"
                    style="display: flex; gap: 12px; margin-bottom: 32px;">
                    <label class="color-option">
                        <input type="radio" name="store_color" value="#658d24" checked>
                        <span class="color-swatch" style="background-color: #658d24;"></span>
                        <span>Groen (Standaard)</span>
                    </label>
                    <label class="color-option">
                        <input type="radio" name="store_color" value="#3b82f6">
                        <span class="color-swatch" style="background-color: #3b82f6;"></span>
                        <span>Blauw</span>
                    </label>
                    <label class="color-option">
                        <input type="radio" name="store_color" value="#8b5cf6">
                        <span class="color-swatch" style="background-color: #8b5cf6;"></span>
                        <span>Paars</span>
                    </label>
                    <label class="color-option">
                        <input type="radio" name="store_color" value="#f59e0b">
                        <span class="color-swatch" style="background-color: #f59e0b;"></span>
                        <span>Oranje</span>
                    </label>
                    <label class="color-option">
                        <input type="radio" name="store_color" value="#ef4444">
                        <span class="color-swatch" style="background-color: #ef4444;"></span>
                        <span>Rood</span>
                    </label>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>Instellingen Opslaan</span>
                    <i class="material-icons">save</i>
                </button>
            </form>
        </div>
    </main>
</body>

</html>
