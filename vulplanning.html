<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>

    <link rel="stylesheet" href="css/vulplanning.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module" src="js/vulplanning/rooster.js"></script>

    <title>Vulplanning Maker</title>
</head>

<body>
    <div class="page-container">
        <div class="planning-card">
            <div class="card-header">
                <h2 class="card-title">1. Rooster / Vulploeg Invoeren</h2>
                <p class="card-subtitle">Voer medewerkers in met hun werktijden en pauze.</p>
            </div>
            <div class="card-body">
                <div id="vullers-container" class="vullers-list"></div>
                <div class="planning-actions">
                    <button type="button" id="btn-add-vuller" class="btn btn-add-vuller">
                        <span class="material-icons btn-icon">add</span>
                        <span>Vuller Toevoegen</span>
                    </button>
                    <button type="button" id="btn-import-rooster" class="btn btn-secondary">
                        <span class="material-icons btn-icon">file_download</span>
                        <span>Importeren</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
