<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instellingen Winkel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/instellingen_winkel.css">
    <script src="scripts/instellingen_winkel.js" type="module"></script>
</head>

<body>
    <main class="dashboard-container">
        <div class="page-header page-header-col">
            <div class="page-header-row">
                <i class="material-icons page-header-icon">store</i>
                <h1 class="page-header-title">Instellingen Winkel</h1>
            </div>
            <p class="page-header-subtitle">Beheer winkelinstellingen en pagina-toegang voor medewerkers</p>
        </div>
        <div class="management-card">
            <div class="message" id="message-box">
                <i class="material-icons" id="message-icon"></i>
                <span id="message-text"></span>
            </div>
            <form id="store-settings-form">
                <h2 class="settings-section-title">Module-toegang voor medewerkers</h2>
                <p class="settings-section-subtitle">Bepaal welke pagina's zichtbaar zijn op het dashboard en in het
                    zijmenu.</p>
                <div class="modules-grid" id="modules-container">
                    <div class="loading-cell">Instellingen laden...</div>
                </div>

                <div style="display: flex; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border-color);">
                    <button type="submit" class="submit-btn" id="submitBtn" style="max-width: 220px; padding: 12px 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px;">
                        <span>Instellingen Opslaan</span>
                        <i class="material-icons" style="font-size: 18px;">save</i>
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
