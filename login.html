<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/main.js"></script>

    <link rel="stylesheet" href="css/login.css" />
    <script type="module" src="js/login.js"></script>

    <title>Login</title>
  </head>

  <body>
    <div class="bg-shapes"></div>

    <div class="login-container">
      <div class="login-header">
        <div class="logo-row">
          <div class="login-logo-box">
            <span class="material-icons logo-icon">inventory_2</span>
          </div>
          <div class="logo-brand-col">
            <div class="logo-title-wrap">
              <h1>INSTOCK</h1>
              <span class="login-beta-badge">BETA</span>
            </div>
          </div>
        </div>
        <p>Log in om toegang te krijgen tot uw winkel</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="storecode">WINKELCODE</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">store</span>
            <input
              type="text"
              id="storecode"
              placeholder="bijv. AMS01"
              required
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="username">GEBRUIKERSNAAM</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">badge</span>
            <input
              type="text"
              id="username"
              placeholder="bijv. 12345"
              required
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">WACHTWOORD</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock</span>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
              autocomplete="new-password"
              autofocus
            />
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember" checked />
          <label for="remember">Onthoud winkelcode en gebruikersnaam</label>
        </div>

        <button type="submit">
          <span class="btn-content">
            Inloggen
            <span class="material-icons btn-icon">login</span>
          </span>
          <span class="btn-dots">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <button type="button" id="passkeyBtn" class="btn-secondary">
          <span class="btn-content">
            Inloggen met Passkey
            <span class="material-icons btn-icon">fingerprint</span>
          </span>
          <span class="btn-dots">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </form>
    </div>
  </body>
</html>
