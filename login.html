    <div class="login-container">
        <div class="login-header">
            <div class="logo-row">
                <span class="material-icons logo-icon">inventory_2</span>
                <h1>INSTOCK</h1>
            </div>
            <p>Log in om toegang te krijgen tot uw winkel</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="storecode">WINKELCODE</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">store</span>
                    <input type="text" id="storecode" placeholder="bijv. AMS01" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                </div>
            </div>

            <div class="form-group">
                <label for="username">GEBRUIKERSNAAM</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">badge</span>
                    <input type="text" id="username" placeholder="bijv. 12345" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                </div>
            </div>

            <div class="form-group">
                <label for="password">WACHTWOORD</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" checked>
                <label for="remember">Onthoud winkelcode en gebruikersnaam</label>
            </div>

            <button type="submit">
                Inloggen
                <span class="material-icons btn-icon">login</span>
            </button>
        </form>
    </div>
